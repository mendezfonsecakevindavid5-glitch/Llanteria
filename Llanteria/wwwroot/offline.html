<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sin conexión - Llandupar</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #16181c; }
        main { max-width: 440px; margin: 1.5rem; padding: 2.5rem 2rem; background: #fff; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,.1); }
        h1 { margin: 0 0 .75rem; font-size: 1.6rem; }
        p { margin: 0 0 1.5rem; color: #4b5563; line-height: 1.5; }
        button { background: #C92B0A; color: #fff; border: 0; padding: .9rem 1.6rem; font-size: 1rem; font-weight: 700; cursor: pointer; text-transform: uppercase; }
        button:hover { filter: brightness(.88); }
    </style>
</head>
<body>
    <main>
        <h1>Sin conexión</h1>
        <p>No pudimos cargar esta página porque tu internet está muy lento o se cayó. Las páginas que ya visitaste siguen disponibles; esta todavía no se ha guardado en tu dispositivo.</p>
        <button type="button" onclick="location.reload()">Reintentar</button>
    </main>
    <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
